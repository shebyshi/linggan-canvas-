<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灵感画布</title>
    <link rel="icon" href="./assets/favicon.ico" />
    <link rel="stylesheet" href="./styles.css?v=ai-image-20260524-1" />
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>灵感画布</h1>
            <p>本地自动保存</p>
          </div>
        </div>

        <section class="search-panel">
          <input id="searchInput" type="search" placeholder="搜索节点" />
          <button id="searchButton" type="button" title="定位节点">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6"></circle>
              <path d="M16 16l4 4"></path>
            </svg>
          </button>
        </section>

        <section class="tool-group">
          <div class="tool-label">创建</div>
          <button id="addTask" class="tool-button">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"></rect></svg>
            </span>
            <span>任务</span>
          </button>
          <button id="addNote" class="tool-button">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M6 4h12v12l-4 4H6z"></path><path d="M14 20v-4h4"></path></svg>
            </span>
            <span>备注</span>
          </button>
          <button id="addImage" class="tool-button">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"></rect><path d="M7 16l4-4 3 3 2-2 3 3"></path><circle cx="9" cy="9" r="1.3"></circle></svg>
            </span>
            <span>图片</span>
          </button>
          <input id="imageInput" type="file" accept="image/*" hidden />
          <button id="addVideo" class="tool-button">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="4" y="6" width="12" height="12" rx="3"></rect><path d="M16 10l5-3v10l-5-3z"></path></svg>
            </span>
            <span>视频</span>
          </button>
          <input id="videoInput" type="file" accept="video/*" hidden />
        </section>

        <section class="tool-group">
          <div class="tool-label">编辑</div>
          <button id="undoAction" class="tool-button">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M9 7H4v5"></path><path d="M4 12c2-4 6-6 10-5 3 .7 5 3 5 6 0 4-3 7-7 7-2 0-4-.8-5.3-2.2"></path></svg>
            </span>
            <span>撤回</span>
          </button>
          <button id="createGroup" class="tool-button">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"></rect><path d="M8 9h8"></path><path d="M8 13h5"></path></svg>
            </span>
            <span>创建分组</span>
          </button>
          <button id="ungroupSelected" class="tool-button" disabled>
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"></rect><path d="M8 12h8"></path><path d="M12 8v8"></path></svg>
            </span>
            <span>解锁分组</span>
          </button>
          <button id="deleteSelected" class="tool-button danger subtle">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 7h14"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M8 7l1-3h6l1 3"></path><path d="M7 7l1 13h8l1-13"></path></svg>
            </span>
            <span>删除</span>
          </button>
          <button id="fitView" class="tool-button">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M8 4H4v4"></path><path d="M16 4h4v4"></path><path d="M8 20H4v-4"></path><path d="M16 20h4v-4"></path><circle cx="12" cy="12" r="2"></circle></svg>
            </span>
            <span>居中</span>
          </button>
          <button id="clearCanvas" class="tool-button danger ghost">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 6h14"></path><path d="M8 6l1-3h6l1 3"></path><path d="M7 6l1 15h8l1-15"></path></svg>
            </span>
            <span>清空</span>
          </button>
        </section>

        <section class="tool-group">
          <div class="tool-label">AI</div>
          <button id="aiSettings" class="tool-button">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 3v3"></path><path d="M12 18v3"></path><path d="M3 12h3"></path><path d="M18 12h3"></path><circle cx="12" cy="12" r="4"></circle></svg>
            </span>
            <span>AI 设置</span>
          </button>
          <button id="aiGenerate" class="tool-button">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path><path d="M5 6v12"></path></svg>
            </span>
            <span>AI 生成</span>
          </button>
        </section>

        <div class="hint">
          <p>滚轮缩放，拖动画布平移。</p>
          <p>图片和视频可直接从文件夹拖进画布。</p>
        </div>
      </aside>

      <section class="stage-wrap">
        <div class="topbar">
          <div class="status">
            <span id="modeDot" class="mode-dot"></span>
            <span id="modeText">选择模式</span>
          </div>
          <div class="file-actions">
            <button id="importJson" class="topbar-button" type="button" title="打开画布">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V10"></path><path d="M8 14l4-4 4 4"></path><path d="M5 4h14"></path></svg>
              <span>打开画布</span>
            </button>
            <button id="exportJson" class="topbar-button" type="button" title="保存画布">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10"></path><path d="M8 10l4 4 4-4"></path><path d="M5 20h14"></path></svg>
              <span>保存画布</span>
            </button>
            <input id="jsonInput" type="file" accept="application/json" hidden />
          </div>
          <div class="zoom-chip" id="zoomLabel">100%</div>
        </div>

        <div id="viewport" class="viewport">
          <svg id="links" class="links"></svg>
          <div id="groupsLayer" class="groups"></div>
          <div id="canvas" class="canvas"></div>
          <div id="selectionBox" class="selection-box" hidden></div>
        </div>
      </section>
    </main>

    <div id="contextMenu" class="context-menu" hidden></div>
    <div id="aiModal" class="modal-backdrop" hidden>
      <section class="modal">
        <div class="modal-header">
          <h2>AI 接口设置（可选）</h2>
          <button id="closeAiModal" class="icon-button" type="button" aria-label="关闭">&times;</button>
        </div>
        <label class="field">
          <span>ChatGPT / OpenAI API Key</span>
          <input id="aiApiKey" type="password" placeholder="sk-..." autocomplete="off" />
        </label>
        <label class="field">
          <span>文字模型</span>
          <input id="aiModel" type="text" placeholder="gpt-4.1-mini" />
        </label>
        <label class="field">
          <span>文字接口地址</span>
          <input id="aiEndpoint" type="url" placeholder="https://api.openai.com/v1/responses" />
        </label>
        <label class="field">
          <span>你要 AI 做什么</span>
          <textarea id="aiPrompt" rows="4" placeholder="例如：把选中的内容整理成执行清单；或：把选中的图片改成商业科技海报风格。"></textarea>
        </label>
        <div class="field-grid">
          <label class="field">
            <span>图片模型</span>
            <input id="aiImageModel" type="text" placeholder="gpt-image-1" />
          </label>
          <label class="field">
            <span>图片数量</span>
            <select id="aiImageCount">
              <option value="1">1 张</option>
              <option value="2">2 张</option>
              <option value="3">3 张</option>
              <option value="4">4 张</option>
            </select>
          </label>
        </div>
        <label class="field">
          <span>图片接口地址</span>
          <input id="aiImageEndpoint" type="url" placeholder="https://api.openai.com/v1/images/generations" />
        </label>
        <p class="modal-note">这是可选增强功能。不填写也可以正常使用画布；API Key 只保存在当前浏览器本地。</p>
        <div class="modal-actions">
          <button id="skipAiSettings" class="topbar-button muted" type="button">暂不使用</button>
          <button id="saveAiSettings" class="topbar-button" type="button">保存设置</button>
          <button id="testAiSettings" class="topbar-button" type="button">测试接口</button>
          <button id="aiTextGenerate" class="topbar-button" type="button">生成文字</button>
          <button id="aiImageGenerate" class="topbar-button" type="button">生成/改图</button>
        </div>
      </section>
    </div>
    <script src="./app.js?v=ai-image-20260524-1"></script>
  </body>
</html>
